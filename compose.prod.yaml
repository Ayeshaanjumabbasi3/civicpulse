services:
  database:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
    deploy: {resources: {limits: {cpus: '1.0', memory: 512M}}}
  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"], interval: 10s, timeout: 5s, retries: 5}
    deploy: {resources: {limits: {cpus: '0.25', memory: 256M}}}
  backend:
    image: ${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
    networks: [edge, internal]
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"], interval: 10s, timeout: 5s, retries: 10}
    deploy: {resources: {limits: {cpus: '0.5', memory: 512M}}}
  frontend:
    image: ${IMAGE_TAG}
    restart: unless-stopped
    ports: ["8080:80"]
    networks: [edge]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"], interval: 10s, timeout: 5s, retries: 5}
    deploy: {resources: {limits: {cpus: '0.25', memory: 128M}}}
networks:
  edge: {driver: bridge}
  internal: {driver: bridge, internal: true}
volumes:
  pgdata:
  redisdata:
