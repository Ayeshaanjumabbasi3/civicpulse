apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: civicpulse
spec:
  type: ClusterIP
  selector: {app: backend}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: newfolder-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args: ["alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          ports: [{containerPort: 8000}]
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 5"]}
          env:
            - name: POSTGRES_HOST
              valueFrom: {configMapKeyRef: {name: civicpulse-config, key: POSTGRES_HOST}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: civicpulse-config, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: civicpulse-config, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: civicpulse-secrets, key: POSTGRES_PASSWORD}}
            - name: REDIS_HOST
              valueFrom: {configMapKeyRef: {name: civicpulse-config, key: REDIS_HOST}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: civicpulse-secrets, key: REDIS_PASSWORD}}
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):6379/0"
            - name: TRIAGE_PROVIDER
              valueFrom: {configMapKeyRef: {name: civicpulse-config, key: TRIAGE_PROVIDER}}
            - name: RATE_LIMIT_PER_MINUTE
              valueFrom: {configMapKeyRef: {name: civicpulse-config, key: RATE_LIMIT_PER_MINUTE}}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: civicpulse-secrets, key: LLM_API_KEY}}
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "768Mi"}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
