apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: civicpulse
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: civicpulse
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: newfolder-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
      volumes:
        - name: nginx-config
          configMap: {name: frontend-nginx-config}
