apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: civicpulse
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          command: ["redis-server"]
          args: ["--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: civicpulse-secrets, key: REDIS_PASSWORD}}
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "256Mi"}
          startupProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]}
            periodSeconds: 20
          volumeMounts: [{name: redisdata, mountPath: /data}]
      volumes:
        - name: redisdata
          persistentVolumeClaim: {claimName: redisdata}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisdata
  namespace: civicpulse
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
