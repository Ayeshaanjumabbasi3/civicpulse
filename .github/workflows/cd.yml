name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    name: Test merged main
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+psycopg://civicpulse:civicpulse@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: civicpulse
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U civicpulse -d civicpulse"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install -e '.[test]' pytest-cov
          python -m alembic upgrade head
          pytest --cov=app --cov-fail-under=65
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Frontend tests
        working-directory: frontend
        run: npm ci --include=optional && npm run test -- --run

  build-push:
    name: Build, push, and SBOM
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image owner
        id: image-names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-backend:${{ github.sha }}
      - id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
      - name: Backend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-backend:${{ github.sha }}
          artifact-name: civicpulse-backend-${{ github.sha }}.spdx.json
          output-file: civicpulse-backend-${{ github.sha }}.spdx.json
      - name: Frontend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
          artifact-name: civicpulse-frontend-${{ github.sha }}.spdx.json
          output-file: civicpulse-frontend-${{ github.sha }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: '*.spdx.json'

  deploy:
    name: Ephemeral k3d deploy and smoke test
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image owner
        id: image-names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Create ephemeral k3d cluster
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create civicpulse-ci --wait --port "8080:80@loadbalancer"
      - name: Load immutable images
        env:
          BACKEND_IMAGE: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
        run: |
          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"
          k3d image import "$BACKEND_IMAGE" "$FRONTEND_IMAGE" -c civicpulse-ci
          sed -i "s#newName: civicpulse/backend#newName: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-backend#; s#newName: civicpulse/frontend#newName: ghcr.io/${{ steps.image-names.outputs.owner }}/civicpulse-frontend#; s#newTag: latest#newTag: ${{ github.sha }}#g" k8s/overlays/prod/kustomization.yaml
      - name: Deploy prod overlay with CI secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          kubectl kustomize k8s/overlays/prod |
            python -c 'import os,sys; s=sys.stdin.read(); s=s.replace("CHANGE_ME", os.environ["POSTGRES_PASSWORD"], 1).replace("CHANGE_ME", os.environ["REDIS_PASSWORD"], 1).replace("CHANGE_ME", os.environ["LLM_API_KEY"], 1); print(s)' |
            awk 'BEGIN { RS="---"; ORS="---\n" } $0 !~ /kind: VerticalPodAutoscaler/ { print }' |
            kubectl apply -f -
      - name: Wait for rollout
        run: |
          set +e
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          backend_status=$?
          if [ "$backend_status" -ne 0 ]; then
            echo '--- civicpulse pods ---'
            kubectl get pods -n civicpulse -o wide
            echo '--- backend description ---'
            kubectl describe deployment/backend -n civicpulse
            kubectl describe pods -n civicpulse -l app=backend
            echo '--- backend logs ---'
            kubectl logs -n civicpulse -l app=backend --all-containers=true --prefix=true --tail=200 || true
            echo '--- recent events ---'
            kubectl get events -n civicpulse --sort-by=.lastTimestamp | tail -50
            exit "$backend_status"
          fi
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s
      - name: Ingress smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS -H 'Host: civicpulse.local' http://localhost:8080/ >/dev/null && break || sleep 2; done
          curl -fsS -H 'Host: civicpulse.local' http://localhost:8080/
          curl -fsS -H 'Host: civicpulse.local' http://localhost:8080/api/complaints
